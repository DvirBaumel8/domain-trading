name: apify-push

# Manual only. Pushes a new build of an actor to Apify. Never publishes, never sets prices or the Store listing.
# The 4 older live actors are allowed only with allow_live=true. Each run needs Dvir's OK through Gavriel.
on:
  workflow_dispatch:
    inputs:
      actor:
        description: Which actor to rebuild (the 4 older live ones need allow_live)
        required: true
        type: choice
        options:
          - wayback-domain-history
          - broken-link-auditor
          - bulk-pagespeed-checker
          - all-new
          - bulk-dns-email-auth-checker
          - sitemap-url-extractor
          - bulk-domain-availability-checker
          - domain-checkup-report
      allow_live:
        description: Allow a rebuild of the 4 older live actors (default false)
        required: false
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Resolve actor list (allow-list)
        env:
          ACTOR: ${{ inputs.actor }}
          ALLOW_LIVE: ${{ inputs.allow_live }}
        run: |
          case "$ACTOR" in
            wayback-domain-history|broken-link-auditor|bulk-pagespeed-checker) echo "ACTORS=$ACTOR" >> "$GITHUB_ENV" ;;
            all-new) echo "ACTORS=wayback-domain-history broken-link-auditor bulk-pagespeed-checker" >> "$GITHUB_ENV" ;;
            bulk-dns-email-auth-checker|sitemap-url-extractor|bulk-domain-availability-checker|domain-checkup-report)
              if [ "$ALLOW_LIVE" != "true" ]; then echo "older live actor: set allow_live=true"; exit 1; fi
              echo "ACTORS=$ACTOR" >> "$GITHUB_ENV"
              echo "LIVE_FLAG=--allow-live" >> "$GITHUB_ENV" ;;
            *) echo "actor not allowed"; exit 1 ;;
          esac
      - name: Pytest first (stop if red)
        run: |
          pip install pytest
          for a in $ACTORS; do
            pip install -r "apify-actors/$a/requirements.txt"
            (cd "apify-actors/$a" && python -m pytest -q tests)
          done
          (cd apify-actors && python -m pytest -q tests)
      - name: Install Apify CLI
        run: npm install -g apify-cli
      - name: Record visibility and price before the push (GET only)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python apify-actors/tools/apify_guard.py $LIVE_FLAG --snapshot "$RUNNER_TEMP/before.json" $ACTORS
      - name: apify push (the token stays in the environment)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: |
          for a in $ACTORS; do
            # Show the CLI output (errors included); redact the token value in case it is ever echoed.
            if ! out=$(cd "apify-actors/$a" && apify push 2>&1); then
              printf '%s\n' "$out" | sed "s|$APIFY_TOKEN|***|g"
              echo "push failed: $a"
              exit 1
            fi
            printf '%s\n' "$out" | sed "s|$APIFY_TOKEN|***|g"
            echo "pushed $a"
          done
      - name: Set run memory to 256 MB (apify push ignores actor.json defaultRunOptions)
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python apify-actors/tools/apify_memory.py $LIVE_FLAG $ACTORS
      - name: Post-push check (fails if the price changed or memory is not 256) and summary
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python apify-actors/tools/apify_guard.py $LIVE_FLAG --before "$RUNNER_TEMP/before.json" $ACTORS
      - name: Keep the DOM-TO-GAVRIEL line
        uses: actions/upload-artifact@v4
        with:
          name: dom-to-gavriel-line
          path: dom-to-gavriel-line.md

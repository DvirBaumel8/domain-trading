# render.yaml: FREE hosting blueprint for the domain-trading API ($0/month).
#
# Free design (Dvir, 5 Oct 2026; same pattern as trader and sapako):
#   - API: Render free web service. It sleeps after ~15 min idle and wakes on the next request (~50 s).
#   - Postgres: Neon free (NOT declared here; DATABASE_URL is set by hand). Use the DIRECT (non-pooler)
#     connection string: the per-domain lock is a session advisory lock. The server refuses a "-pooler." host
#     when APP_ENV=production.
#   - Scheduled work: a free Cloudflare Worker cron (jobs-trigger/) calls POST /jobs/run hourly (tick) and daily
#     (daily jobs + nightly backup export). JOBS_MODE=external means the service starts no timers.
#   - Render free allows 750 instance hours per WORKSPACE per month. trader and sapako each run a 24/7 keep-alive
#     (~730 h each), so deploy this Blueprint in its OWN (new, free) workspace, or one with no always-on service.
#     This service is NOT kept warm: the hourly wake uses about 180 h/month. Do not add a keep-warm ping.
#   - LANDER_TARGET is not an env var the server reads (it is a DB setting, default afternic).
#   - Render crons and Postgres are billed, so neither is used. Backups go to a private data repo (backup.md).
# Setup steps: docs/DEPLOYMENT.md.
# healthCheckPath is /health/ping (no auth, no DB) so Render's checks never wake Neon.

services:
  - type: web
    name: domain-trading-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    # devDependencies are needed to compile (tsc), then pruned. node-pg-migrate, tsx and everything the
    # runtime and `migrate` need are in "dependencies".
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    # Migrations run from plain SQL files at start (no pre-deploy step on the free plan).
    startCommand: npm run migrate up && node dist/main.js
    healthCheckPath: /health/ping
    autoDeployTrigger: 'off'     # Dvir deploys deliberately after tests pass
    envVars:
      - key: NODE_VERSION
        value: 22.23.2           # a recent 22.x patch (same as trader)
      - key: APP_ENV
        value: production
      - key: JOBS_MODE
        value: external
      - key: DATABASE_SSL
        value: 'true'
      - key: ENABLED_REGISTRARS
        value: porkbun,godaddy   # godaddy = NS/details only (D-001); buying is Porkbun only
      # Secrets: values entered in the Render Dashboard only (sync: false). Never in git.
      - key: DATABASE_URL        # Neon DIRECT string, ?sslmode=verify-full (required in production; `require` is refused)
        sync: false
      - key: PORKBUN_API_KEY
        sync: false
      - key: PORKBUN_SECRET_API_KEY
        sync: false
      - key: GODADDY_PAT         # scopes: domains.domain:read, domains.nameserver:update
        sync: false
      - key: GITHUB_BACKUP_TOKEN # fine-grained PAT: the private DATA repo only, Contents read/write
        sync: false
      - key: GITHUB_BACKUP_REPO  # e.g. DvirBaumel8/domain-trading-data (never the code repo)
        sync: false
      - key: JOB_TRIGGER_TOKEN   # same value as the GitHub repo secret used by the Worker
        sync: false

# Render free plan ($0): one stateless web service. No database, no disk, no scheduled jobs, no keep-warm ping.
# It sleeps after about 15 minutes idle and wakes on the next request (about a minute), so callers wake it with GET /health/ping and wait.
# The state is data/state.json in this repo: a push that changes it passes CI first, then deploys. Setup: docs/DEPLOYMENT.md.
services:
  - type: web
    name: domain-trading-api
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    startCommand: node dist/main.js
    healthCheckPath: /health/ping
    autoDeployTrigger: checksPass
    buildFilter:
      ignoredPaths:
        - docs/**
        - .claude/**
        - CLAUDE.md
    envVars:
      - key: NODE_VERSION
        value: "26"
      # Values are entered in the Render dashboard only (sync: false). Never in git.
      - key: PORKBUN_API_KEY         # both or neither; reads only
        sync: false
      - key: PORKBUN_SECRET_API_KEY
        sync: false
      - key: GOOGLE_WEB_RISK_API_KEY
        sync: false
      - key: GODADDY_DOMAINS_PAT
        sync: false
      - key: GODADDY_API_KEY
        sync: false
      - key: GODADDY_API_SECRET
        sync: false
      - key: AFTERNIC_API_KEY
        sync: false
      - key: AFTERNIC_API_SECRET
        sync: false
      - key: USPTO_API_KEY
        sync: false

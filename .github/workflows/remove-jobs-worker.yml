# One-off (Dvir, 23 Nov 2026): deletes the old daily timer Worker. This file is removed right after it runs.
name: remove-jobs-worker
on:
  push:
    branches: [main]
    paths: ['.github/workflows/remove-jobs-worker.yml']
jobs:
  remove:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - uses: actions/setup-node@v4
        with: { node-version: '26' }
      - env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: 'false'
        run: npx --yes wrangler@4 delete --name domain-trading-jobs --force

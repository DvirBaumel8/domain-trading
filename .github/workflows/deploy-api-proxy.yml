name: deploy-api-proxy

# CR-041: the api-proxy Worker is the stable public URL (workers.dev) in front of the Mac mini's Cloudflare quick tunnel.
# The tunnel-watch agent on the Mac sets the TUNNEL_URL repo variable and runs this workflow when the tunnel URL changes.
# Every branch verifies it, but only main may replace the shared production Worker.
on:
  push:
    paths:
      - 'api-proxy/**'
      - '.github/workflows/deploy-api-proxy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-api-proxy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI: 'true'
      WRANGLER_SEND_METRICS: 'false'
    permissions:
      contents: read
    defaults:
      run:
        working-directory: api-proxy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: api-proxy/package-lock.json

      - run: npm ci
        timeout-minutes: 5
      - run: npm test
        timeout-minutes: 5
      - run: npm run typecheck
        timeout-minutes: 3
      - run: npx wrangler deploy --dry-run
        timeout-minutes: 3

      - name: Skip deploy (TUNNEL_URL repo variable not set)
        if: github.ref == 'refs/heads/main' && vars.TUNNEL_URL == ''
        run: echo "::notice::Skipping deploy because the TUNNEL_URL repository variable is empty."

      - name: Deploy api-proxy Worker
        timeout-minutes: 5
        if: github.ref == 'refs/heads/main' && vars.TUNNEL_URL != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # The deployed URL (the stable PUBLIC_BASE_URL / API_BASE_URL) is printed by wrangler: "https://domain-trading-api-proxy.<subdomain>.workers.dev".
          npx wrangler deploy --var "TUNNEL_URL:${{ vars.TUNNEL_URL }}" 2>&1 | tee deploy.log
          echo "Deployed URL: $(grep -oE 'https://domain-trading-api-proxy\.[a-z0-9-]+\.workers\.dev' deploy.log | head -1)"

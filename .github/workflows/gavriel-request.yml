# Wakes a cloud DOM (Claude Code) when Gavriel pushes a request, so Dvir doesn't relay messages (Dvir, 9 Oct 2026).
# Event-driven: runs only on a push to main that changes docs/requests/ and whose head commit is Gavriel's. No polling.
# Uses the Claude Code CLI directly (claude-code-action does not support push events). Skips quietly until the secret CLAUDE_CODE_OAUTH_TOKEN exists.
# Scope (v1): the cloud DOM ANSWERS new requests in their files (verdict, pushback, plan, DVIR items) and pushes that answer.
# It does not change code: pushes made with the workflow token don't run CI, and Render deploys only after CI passes.
# Code work is picked up by DOM's local session. It never calls the production API or database (CLAUDE.md HARD RULE).
name: gavriel-request

on:
  push:
    branches: [main]
    paths: ['docs/requests/**']

concurrency:
  group: gavriel-request
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  answer:
    if: contains(github.event.head_commit.author.name, 'Gavriel')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 20
      - name: Configure git
        run: |
          git config user.name "DOM (cloud)"
          git config user.email "dvirbaumel9@users.noreply.github.com"
      - name: Answer with Claude Code (CLI; skipped while the token secret is missing)
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          PROMPT: |
            You are DOM, the vendor of this repo. Gavriel (the customer bot) just pushed commit ${{ github.sha }} that changes docs/requests/.
            1. Read CLAUDE.md (follow its HARD RULE: never call the production API or database), then docs/internal/code-map.md.
            2. Run `git show --stat ${{ github.sha }}` and `git diff ${{ github.event.before }} ${{ github.sha }} -- docs/requests` to see what Gavriel wrote.
            3. For every request (CR/BUG file or section) in that diff that has no DOM answer yet, append a "## DOM response (<today>)" section in that file, in the repo's existing style (look at earlier DOM responses). Give the verdict (accept, simplify, defer or push back, by the keep-it-simple rule: build only what helps Dvir's buy and sell decisions); the plan and the files from the code map; and items needing Dvir marked **DVIR**. Mark the status line at the top. Never write an approval sentence for Dvir.
            4. If Gavriel only reported results or confirmations, add a short acknowledgement to docs/requests/DOM-TO-GAVRIEL.md only if something needs his action.
            5. Do NOT change code, tests, the contract or package.json. Code work is done by DOM's local session; say in the answer that the build follows.
            6. Commit only docs/requests changes, with the message "requests: DOM (cloud) answers <ids>" and the trailer "Co-Authored-By: Claude <noreply@anthropic.com>", then `git pull --rebase origin main` and `git push origin HEAD:main`.
        run: |
          if [ -z "$CLAUDE_CODE_OAUTH_TOKEN" ]; then echo "::notice::CLAUDE_CODE_OAUTH_TOKEN is not set (Dvir: claude setup-token, then gh secret set CLAUDE_CODE_OAUTH_TOKEN); skipping"; exit 0; fi
          npm install -g @anthropic-ai/claude-code >/dev/null 2>&1
          claude -p "$PROMPT" --allowedTools "Read,Write,Edit,Glob,Grep,Bash(git:*)" --max-turns 60

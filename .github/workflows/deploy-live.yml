# Tells Gavriel when a push to main is live on Render (CR-034; Dvir wants event-driven handoffs).
# Runs after the `ci` workflow passes on main (Render deploys then: autoDeployTrigger checksPass), reads ONLY the
# public GET /health/ping (no token; CLAUDE.md hard rule), then commits one line to docs/requests/DEPLOYS.md as "DOM (cloud)".
# No loop: that commit is pushed with the workflow token, which starts no workflow, and carries [skip render] (no redeploy);
# docs-only pushes are skipped. Then it starts deploy-note (workflow_dispatch), a check on main that Gavriel's listener hears.
name: deploy-live

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50
      - name: Wait for the deploy, then note it in DEPLOYS.md
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          BASE: https://domain-trading-api.onrender.com
        run: |
          changed="$(git diff --name-only "$SHA~1" "$SHA" 2>/dev/null || true)"
          if [ -n "$changed" ] && ! echo "$changed" | grep -qv '^docs/'; then echo "docs-only push; no deploy note"; exit 0; fi
          version="$(git show "$SHA:package.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')"
          # deploy_live: the ping shows this commit. deploy_unknown: the ping answers but has no `commit` field (a server
          # older than 3.7.0, BUG-038), so we can't tell. deploy_failed: the ping never showed this commit within 20 minutes.
          event=deploy_failed
          for i in $(seq 1 60); do   # up to 20 minutes, every 20 s
            commit="$(curl -s --max-time 20 "$BASE/health/ping" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log("commit" in j ? (j.commit||"none") : "absent")}catch{console.log("")}})')"
            if [ "$commit" = "$SHA" ]; then event=deploy_live; break; fi
            if [ "$commit" = "absent" ]; then event=deploy_unknown; fi
            sleep 20
          done
          line="$(TZ=Asia/Jerusalem date +%Y-%m-%dT%H:%M:%S%z) $event $version $SHA"
          git config user.name "DOM (cloud)"
          git config user.email "dvirbaumel9@users.noreply.github.com"
          for attempt in 1 2 3; do
            git pull -q --rebase origin main
            [ -f docs/requests/DEPLOYS.md ] || printf '# Deploys\n\nOne line per push to main that changed code, written by the deploy-live workflow (CR-034): `<time IDT> deploy_live|deploy_failed <version> <commit>`.\n\n' > docs/requests/DEPLOYS.md
            echo "$line" >> docs/requests/DEPLOYS.md
            git add docs/requests/DEPLOYS.md
            git commit -q -m "deploys: $event $version ${SHA:0:7} [skip render]"
            git push -q origin HEAD:main && break
            git reset -q --hard origin/main
          done
          echo "$line"
      - name: Start deploy-note so Gavriel's CI listener hears it (CR-034)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          git pull -q origin main
          line="$(grep " $SHA\$" docs/requests/DEPLOYS.md 2>/dev/null | tail -1)"
          [ -n "$line" ] || { echo "no DEPLOYS line for $SHA (docs-only push or skipped)"; exit 0; }
          set -- $line
          gh workflow run deploy-note.yml --ref main -f event="$2" -f version="$3" -f commit="$4"

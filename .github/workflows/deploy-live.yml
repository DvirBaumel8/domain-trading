# Tells Gavriel when a push to main is live on Render (CR-034; Dvir wants event-driven handoffs).
# Runs after the `ci` workflow passes on main (Render deploys then: autoDeployTrigger checksPass), reads ONLY the
# public GET /health/ping (no token; CLAUDE.md hard rule), then appends one line to DEPLOYS.md on the separate branch `deploy-log`
# (never main, so it can't race with code pushes) and starts deploy-note (workflow_dispatch on main), the check Gavriel's listener hears.
name: deploy-live

on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]

permissions:
  contents: write
  actions: write

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  notify:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 50
      - name: Wait for the deploy, then note it in DEPLOYS.md
        env:
          SHA: ${{ github.event.workflow_run.head_sha }}
          BASE: https://domain-trading-api.onrender.com
          GH_TOKEN: ${{ github.token }}
        run: |
          changed="$(git diff --name-only "$SHA~1" "$SHA" 2>/dev/null || true)"
          if [ -n "$changed" ] && ! echo "$changed" | grep -qv '^docs/'; then echo "docs-only push; no deploy note"; exit 0; fi
          version="$(git show "$SHA:package.json" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')"
          # deploy_live: the ping shows this commit. deploy_unknown: the ping answers but has no `commit` field (a server
          # older than 3.7.0, BUG-038), so we can't tell. deploy_failed: the ping never showed this commit within 20 minutes.
          event=deploy_failed
          for i in $(seq 1 60); do   # up to 20 minutes, every 20 s
            commit="$(curl -s --max-time 20 "$BASE/health/ping" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{const j=JSON.parse(s);console.log("commit" in j ? (j.commit||"none") : "absent")}catch{console.log("")}})')"
            if [ "$commit" = "$SHA" ]; then event=deploy_live; break; fi
            if [ "$commit" = "absent" ]; then event=deploy_unknown; fi
            sleep 20
          done
          line="$(TZ=Asia/Jerusalem date +%Y-%m-%dT%H:%M:%S%z) $event $version $SHA"
          echo "$line" > "$RUNNER_TEMP/deploy-line"
          # The note goes to the separate branch `deploy-log` (BUG fix, CR-034 16:35 note): writing to main raced with code
          # pushes waiting for CI, and Render deploys only main's newest commit. Nothing here ever pushes to main.
          git config user.name "DOM (cloud)"
          git config user.email "dvirbaumel9@users.noreply.github.com"
          for attempt in 1 2 3; do
            rm -rf "$RUNNER_TEMP/log" && mkdir -p "$RUNNER_TEMP/log" && cd "$RUNNER_TEMP/log"
            git init -q && git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
            if git fetch -q origin deploy-log 2>/dev/null; then git checkout -q -b deploy-log FETCH_HEAD; else git checkout -q --orphan deploy-log; printf '# Deploys\n\nOne line per push to main that changed code (deploy-live workflow, CR-034): `<time IDT> deploy_live|deploy_unknown|deploy_failed <version> <commit>`.\n\n' > DEPLOYS.md; fi
            echo "$line" >> DEPLOYS.md
            git add DEPLOYS.md && git commit -q -m "deploys: $event $version ${SHA:0:7}"
            git push -q origin deploy-log && break
            sleep 5
          done
          echo "$line"
      - name: Start deploy-note so Gavriel's CI listener hears it (CR-034)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          line="$(cat "$RUNNER_TEMP/deploy-line" 2>/dev/null || true)"
          [ -n "$line" ] || { echo "no deploy line for $SHA (docs-only push)"; exit 0; }
          set -- $line
          gh workflow run deploy-note.yml --ref main -f event="$2" -f version="$3" -f commit="$4"

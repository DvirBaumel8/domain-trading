name: release

# Pushing a tag vX.Y.Z marks a release. Render deploys every push to main itself, once CI passes
# (autoDeployTrigger: checksPass), so this workflow only verifies the tag:
#   1. the tag must be the tip of main, equal package.json's version and have a CHANGELOG entry;
#   2. the full test suite must pass (ci.yml);
on:
  push:
    tags: ['v*.*.*']

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tag is the tip of main (Render's deploy hook deploys main's latest commit)
        run: |
          git fetch -q origin main
          [ "$(git rev-parse "$GITHUB_SHA")" = "$(git rev-parse origin/main)" ] || { echo "::error::tag $GITHUB_REF_NAME is not the tip of main; the deploy hook would ship a different commit"; exit 1; }
      - name: Tag matches package.json and the CHANGELOG
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          [ "$tag" = "$pkg" ] || { echo "::error::tag v$tag but package.json is $pkg"; exit 1; }
          grep -q "^## $tag" docs/contract/CHANGELOG.md || { echo "::error::no '## $tag' entry in docs/contract/CHANGELOG.md"; exit 1; }

  test:
    needs: check-version
    uses: ./.github/workflows/ci.yml

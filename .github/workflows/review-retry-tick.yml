name: review-retry-tick

# CR-011 addendum C (retimed in v2.16.0): one short `tick` a day at 08:30 UTC so `reviewRetry` can retry a review that got a 429 in
# the daily run. Google's free-tier quota resets at midnight Pacific = 07:00 UTC in summer (PDT) and 08:00 UTC in winter (PST);
# 08:30 UTC is after the reset in both seasons (07:30 UTC was before it in winter).
# The Cloudflare account is at the Workers Free limit of cron triggers, so this schedule lives here (free).
# It calls the API like the Worker does (wake-up ping, then POST). Since 3.0.0 the POST only enqueues the run and answers 202 with its run id;
# the server works the steps, so this workflow checks the 202 and logs the run id (it has no READ token to poll GET /jobs/runs, and no secret is added).
on:
  schedule:
    - cron: '30 8 * * *'
  workflow_dispatch:

# v3.9.0: the job needs no token of its own (the API token is a repository secret passed to the step), so the GITHUB_TOKEN gets no permissions
permissions: {}

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: POST /jobs/run tick
        env:
          API_BASE_URL: ${{ vars.API_BASE_URL }}
          JOB_TRIGGER_TOKEN: ${{ secrets.JOB_TRIGGER_TOKEN }}
        run: |
          test -n "$API_BASE_URL" || { echo "::error::API_BASE_URL repository variable is empty; the review retry tick cannot run"; exit 1; }
          test -n "$JOB_TRIGGER_TOKEN" || { echo "::error::JOB_TRIGGER_TOKEN repo secret is empty"; exit 1; }
          # the schedule uses the fixed daily key (a retried run of the same day is deduplicated); a by-hand run gets a key from the current time, so it is a new run
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            ms=$(( $(date -u +%s) * 1000 ))
          else
            ms=$(( $(date -u -d "$(date -u +%Y-%m-%d) 08:30:00" +%s) * 1000 ))
          fi
          # wake the free instance first (cold start), then run the job
          curl -s -o /dev/null --max-time 90 "$API_BASE_URL/health/ping" || true
          code=$(curl -s -o out.json -w '%{http_code}' --max-time 60 -X POST "$API_BASE_URL/jobs/run" \
            -H "Authorization: Bearer $JOB_TRIGGER_TOKEN" -H 'Content-Type: application/json' \
            -H "Idempotency-Key: tick-$ms" -d '{"job":"tick"}')
          echo "HTTP $code"; head -c 2000 out.json; echo
          test "$code" = 202 || { echo "::error::POST /jobs/run answered HTTP $code"; exit 1; }
          run_id=$(jq -r '.run_id // empty' out.json) || { echo "::error::the answer is not JSON"; exit 1; }
          test -n "$run_id" || { echo "::error::the answer has no run_id"; exit 1; }
          echo "tick queued: $run_id (skipped: $(jq -r '.skipped' out.json))"

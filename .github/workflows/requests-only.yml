name: requests-only

# Gavriel (the customer's bot) may only add or change files under docs/requests/, plus apify-actors/*/README.md and the text keys of apify-actors/*/.actor/*.json.
# Every commit in a push whose author or committer name contains "Gavriel", "Grok" or "DOM (cloud)" is checked.
# This catches mistakes; it cannot undo a push. Real enforcement = branch protection plus a separate
# GitHub identity for Gavriel.
on:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Bot commits touch docs/requests/ only
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then range="$AFTER"; else range="$BEFORE..$AFTER"; fi
          bad=0
          for c in $(git rev-list "$range"); do
            who="$(git log -1 --format='%an|%cn' "$c")"
            if echo "$who" | grep -qiE 'gavriel|grok|dom \(cloud\)'; then
              if ! python3 apify-actors/tools/bot-text-guard.py "$c"; then bad=1; fi
            fi
          done
          exit $bad

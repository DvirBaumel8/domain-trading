name: deploy-jobs-trigger

# The jobs-trigger Worker has one production name and its Cron Triggers. Every
# branch verifies it, but only main may replace that shared production Worker.
on:
  push:
    branches: ['**']
    paths:
      - 'jobs-trigger/**'
      - '.github/workflows/deploy-jobs-trigger.yml'
  workflow_dispatch:

concurrency:
  group: deploy-jobs-trigger-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: jobs-trigger
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: jobs-trigger/package-lock.json

      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npx wrangler deploy --dry-run

      - name: Skip deploy (API_BASE_URL repo variable not set)
        if: github.ref == 'refs/heads/main' && vars.API_BASE_URL == ''
        run: echo "::notice::Skipping deploy because the API_BASE_URL repository variable is empty."

      - name: Deploy jobs-trigger Worker
        if: github.ref == 'refs/heads/main' && vars.API_BASE_URL != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          JOB_TRIGGER_TOKEN: ${{ secrets.JOB_TRIGGER_TOKEN }}
        run: |
          npx wrangler deploy --var API_BASE_URL:${{ vars.API_BASE_URL }}
          echo "$JOB_TRIGGER_TOKEN" | npx wrangler secret put JOB_TRIGGER_TOKEN

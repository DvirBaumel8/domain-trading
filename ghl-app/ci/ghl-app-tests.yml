# Install as .github/workflows/ghl-app-tests.yml (the bot cannot write that folder).
name: ghl-app-tests

on:
  pull_request:
    paths: ['ghl-app/**', '.github/workflows/ghl-app-tests.yml']
  push:
    branches: [main]
    paths: ['ghl-app/**', '.github/workflows/ghl-app-tests.yml']

permissions:
  contents: read

jobs:
  ghl-app-tests:
    name: ghl-app-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Tests
        working-directory: ghl-app
        run: python -m unittest discover -s tests
